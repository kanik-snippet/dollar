{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div id="content-main">
  <form method="post">
    {% csrf_token %}
    <fieldset class="module aligned">
      <h2>Generate proxy pools by country</h2>
      {{ form.as_p }}
    </fieldset>
    <div class="submit-row">
      <input type="submit" value="Queue generation" class="default">
      <a href="{% url 'admin:control_proxypooltarget_changelist' %}" class="button cancel-link">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
