{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ panel_title }}</title>
  <link rel="stylesheet" href="{% static 'control/panel.css' %}">
</head>
<body>
  <div class="mobile-overlay" data-sidebar-close></div>
  <div class="app-shell" id="panel-app"
       data-access-url="{% url 'control:panel-access-api' %}"
       data-proxy-url="{% url 'control:panel-proxy-api' %}"
       data-optix-url="{% url 'control:panel-optix-api' %}"
       data-releases-url="{% url 'control:panel-releases-api' %}">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark">$</div>
        <div>
          <strong>Dollar</strong>
          <span>Operations</span>
        </div>
      </div>
      <div class="environment">
        <span class="pulse-dot"></span>
        <span>Live operations</span>
      </div>

      <nav class="nav-stack">
        <div class="nav-section">
          <p>Operations</p>
          <button class="nav-item is-active" data-route="access"><span class="nav-icon">A</span><span>Access</span></button>
          <button class="nav-item" data-route="proxy"><span class="nav-icon">P</span><span>Proxy</span></button>
          <button class="nav-item" data-route="optix"><span class="nav-icon">O</span><span>Dollar Control</span></button>
          <button class="nav-item" data-route="releases"><span class="nav-icon">R</span><span>Dollar Releases</span></button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-avatar">{{ request.user.username|slice:":1"|upper }}</div>
        <div class="user-copy">
          <strong>{{ request.user.get_full_name|default:request.user.username }}</strong>
          <span>Administrator</span>
        </div>
        <div class="user-actions">
          <a class="footer-action" href="{{ admin_url }}" title="Open Django admin">Admin</a>
          <form method="post" action="{{ logout_url }}">
            {% csrf_token %}
            <button class="footer-action logout-action" type="submit" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10"/></svg></button>
          </form>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" type="button" data-sidebar-open aria-label="Open menu">Menu</button>
          <div>
            <div class="breadcrumb">Dollar <span>/</span> <span id="page-breadcrumb">Access</span></div>
            <h1 id="page-title">Access</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="notification-button" type="button" id="notification-button" aria-label="Open access notifications">
            <span class="notification-icon">Bell</span><span class="notification-count" id="notification-count" hidden>0</span>
          </button>
          <span class="sync-status"><span class="pulse-dot"></span><span id="sync-label">Live</span></span>
          <button class="button button-secondary refresh-button" type="button" id="refresh-button"><span class="refresh-spinner" aria-hidden="true"></span><span>Refresh</span></button>
        </div>
      </header>

      <section class="content" id="panel-content" aria-live="polite">
        <div class="loading-state">
          <div class="loading-line loading-line-wide"></div>
          <div class="loading-grid">
            <div class="loading-card"></div><div class="loading-card"></div>
            <div class="loading-card"></div><div class="loading-card"></div>
          </div>
          <div class="loading-table"></div>
        </div>
      </section>
    </main>
  </div>

  <dialog class="detail-dialog side-drawer" id="detail-dialog"></dialog>

  <template id="error-template">
    <div class="empty-state">
      <div class="empty-symbol">!</div>
      <h2>Data could not be loaded</h2>
      <p>Refresh the page or verify that your administrator session is still active.</p>
      <button class="button button-primary" type="button" data-retry>Try again</button>
    </div>
  </template>

  <span id="panel-csrf-token" hidden>{% csrf_token %}</span>
  <script src="{% static 'control/panel.js' %}" defer></script>
</body>
</html>
